<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Cờ Vua Online</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 15px; font-size: 24px; color: #f1c40f; }
        #board {
            width: 90vw;
            max-width: 440px;
            height: 90vw;
            max-height: 440px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid #404040;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .white-sq { background-color: #eeeed2; }
        .dark-sq { background-color: #769656; }
        .selected { background-color: #f7ec59 !important; }
        
        .piece-img {
            width: 85%;
            height: 85%;
            pointer-events: none;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Game Cờ Vua Online</h1>
    <div id="board"></div>
    <button class="btn" onclick="resetGame()">Ván Mới</button>

    <script>
        const game = new Chess();
        const boardEl = document.getElementById('board');
        let selectedSquare = null;

        // Ảnh quân cờ vector cực đẹp không bị lỗi ?
        function getPieceImg(piece) {
            const color = piece.color;
            const type = piece.type.toUpperCase();
            return `https://images.lichess.org/piece/cburnett/${color}${type}.svg`;
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareEl = document.createElement('div');
                    const squareName = String.fromCharCode(97 + c) + (8 - r);
                    const isLight = (r + c) % 2 === 0;

                    squareEl.className = `square ${isLight ? 'white-sq' : 'dark-sq'}`;
                    if (selectedSquare === squareName) squareEl.classList.add('selected');

                    const piece = board[r][c];
                    if (piece) {
                        const img = document.createElement('img');
                        img.src = getPieceImg(piece);
                        img.className = 'piece-img';
                        squareEl.appendChild(img);
                    }

                    squareEl.addEventListener('click', () => handleSquareClick(squareName));
                    boardEl.appendChild(squareEl);
                }
            }
        }

        function handleSquareClick(square) {
            const piece = game.get(square);

            // Bấm chọn quân cờ màu Trắng
            if (!selectedSquare) {
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                // Thử di chuyển
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move) {
                    // Nếu đi ĐÚNG LUẬT: Cho quân di chuyển + Máy đi lại ngay
                    selectedSquare = null;
                    renderBoard();
                    if (!game.game_over()) {
                        setTimeout(makeAIMove, 300);
                    }
                } else {
                    // Nếu đi SAI LUẬT (như bấm Tốt đi chéo): KHÔNG CHO ĐI, đổi sang chọn quân mới nếu bấm vào quân Trắng khác
                    if (piece && piece.color === 'w') {
                        selectedSquare = square;
                    }
                    renderBoard();
                }
            }
        }

        function makeAIMove() {
            const moves = game.moves();
            if (moves.length === 0) return;
            const randomMove = moves[Math.floor(Math.random() * moves.length)];
            game.move(randomMove);
            renderBoard();
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            renderBoard();
        }

        renderBoard();
    </script>
</body>
</html>
